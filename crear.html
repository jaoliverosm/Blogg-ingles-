<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create post · English II Blog</title>
  <meta name="description" content="Publish a new post on the English II blog — Universidad del Tolima.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600&display=swap" rel="stylesheet">
  <!-- Editor de texto enriquecido (Quill) -->
  <link href="https://cdn.quilljs.com/2.0.3/quill.snow.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    /* Aplica el tema guardado antes de pintar (evita parpadeo) */
    if (localStorage.getItem('tema') === 'dark' ||
        (!localStorage.getItem('tema') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>
</head>
<body class="pagina-crear">

  <!-- ===== Encabezado común ===== -->
  <header class="header">
    <div class="contenedor header-inner">
      <a class="brand" href="index.html">
        <span class="brand-logo">📖</span>
        <span class="brand-texto">
          <strong>English II Blog</strong>
          <small>Universidad del Tolima</small>
        </span>
      </a>
      <nav class="nav" aria-label="Main navigation">
        <button id="btn-tema" class="boton boton-icono" type="button" title="Toggle light/dark theme" aria-label="Toggle light/dark theme">🌙</button>
        <a id="btn-nueva-entrada" class="boton boton-primario" href="crear.html" style="display:none">＋ New post</a>
        <button id="btn-logout" class="boton boton-secundario" type="button" style="display:none">Sign out</button>
      </nav>
    </div>
  </header>

  <main>
    <div class="contenedor">
      <div class="encabezado-pagina">
        <h1>Create new post</h1>
        <!-- app.js shows here which account is publishing -->
        <p id="info-sesion" class="subtitulo"></p>
      </div>

      <!--
        Esta tarjeta está oculta mientras app.js verifica la sesión.
        Si no hay sesión activa, app.js redirige a login.html.
      -->
      <div id="tarjeta-crear" class="tarjeta-formulario tarjeta-formulario--ancha" style="visibility:hidden">
        <form id="form-publicar" class="formulario" novalidate>
          <div class="campo">
            <label for="titulo">Title</label>
            <input type="text" id="titulo" maxlength="120" autocomplete="off"
                   placeholder="E.g.: How we used the simple past this week">
          </div>

          <div class="campo">
            <label>Content</label>
            <!-- Rich text editor (Google Docs style): created by app.js -->
            <div id="editor-contenido"></div>
          </div>

          <div class="campo">
            <label for="imagen">Cover image (optional — appears at the top of the post)</label>
            <input type="url" id="imagen" placeholder="https://example.com/image.jpg">
            <img id="preview-imagen" alt="Image preview" hidden>
          </div>

          <div class="campo">
            <label for="video">YouTube video URL (optional)</label>
            <input type="url" id="video" placeholder="https://www.youtube.com/watch?v=...">
          </div>

          <button type="submit" class="boton boton-primario boton-bloque">🚀 Publish post</button>
        </form>
      </div>
    </div>
  </main>

  <!-- ===== Pie de página ===== -->
  <footer class="footer">
    <div class="contenedor">
      <p>Academic blog · English II · Universidad del Tolima</p>
      <p class="footer-nota"><a href="index.html">← Back to the blog</a></p>
    </div>
  </footer>

  <!-- Editor de texto enriquecido (Quill) -->
  <script src="https://cdn.quilljs.com/2.0.3/quill.js"></script>
  <!-- SDK de Firebase (compat, sin build). Puedes subir la versión. -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <!-- Configuración con tus credenciales -->
  <script src="firebase-config.js"></script>
  <!-- Lógica del sitio -->
  <script src="app.js?v=8"></script>
</body>
</html>
