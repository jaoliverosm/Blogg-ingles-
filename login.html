<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in · English II Blog</title>
  <meta name="description" content="Log in to publish on the English II blog — Universidad del Tolima.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    /* Aplica el tema guardado antes de pintar (evita parpadeo) */
    if (localStorage.getItem('tema') === 'dark' ||
        (!localStorage.getItem('tema') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>
</head>
<body class="pagina-login">

  <!-- ===== Encabezado común ===== -->
  <header class="header">
    <div class="contenedor header-inner">
      <a class="brand" href="index.html">
        <span class="brand-logo">📖</span>
        <span class="brand-texto">
          <strong>English II Blog</strong>
          <small>Universidad del Tolima</small>
        </span>
      </a>
      <nav class="nav" aria-label="Main navigation">
        <button id="btn-tema" class="boton boton-icono" type="button" title="Toggle light/dark theme" aria-label="Toggle light/dark theme">🌙</button>
        <a id="btn-nueva-entrada" class="boton boton-primario" href="crear.html" style="display:none">＋ New post</a>
        <button id="btn-logout" class="boton boton-secundario" type="button" style="display:none">Sign out</button>
      </nav>
    </div>
  </header>

  <main>
    <div class="contenedor">
      <!-- ===== Tarjeta de inicio de sesión ===== -->
      <div class="tarjeta-formulario">
        <h1>Log in</h1>
        <p class="subtitulo">Enter with the email and password your teacher assigned you to publish.</p>

        <form id="form-login" class="formulario" novalidate>
          <div class="campo">
            <label for="email">Email</label>
            <input type="email" id="email" autocomplete="email" placeholder="you@email.com">
          </div>

          <div class="campo">
            <label for="password">Password</label>
            <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">
          </div>

          <!-- Mensajes de error (los rellena app.js) -->
          <div id="error-login" class="alerta alerta-error" hidden></div>

          <button type="submit" class="boton boton-primario boton-bloque">Log in</button>
        </form>

        <p class="footer-nota">Don't have credentials? Ask the classmate who manages the blog.</p>
      </div>
    </div>
  </main>

  <!-- ===== Pie de página ===== -->
  <footer class="footer">
    <div class="contenedor">
      <p>Academic blog · English II · Universidad del Tolima</p>
      <p class="footer-nota"><a href="index.html">← Back to the blog</a></p>
    </div>
  </footer>

  <!-- SDK de Firebase (compat, sin build). Puedes subir la versión. -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <!-- Configuración con tus credenciales -->
  <script src="firebase-config.js"></script>
  <!-- Lógica del sitio -->
  <script src="app.js?v=8"></script>
</body>
</html>
